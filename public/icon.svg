<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Coral / Salmon signature gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8D5E"/>
      <stop offset="100%" stop-color="#FF6B6B"/>
    </linearGradient>

    <!-- Subtle border highlight -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8D5E" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#FF6B6B" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Warm radial ambient glow -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF8D5E" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FF6B6B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Dark Rounded Squircle Base (#181A1D matching portfolio theme) -->
  <rect width="64" height="64" rx="16" fill="#181A1D"/>

  <!-- Ambient Glow Behind Monogram -->
  <circle cx="32" cy="32" r="24" fill="url(#bgGlow)"/>

  <!-- Subtle Glowing Inner Border -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Stylized Designer 'A' Monogram for Asadujjaman -->
  <path d="M 32 13 C 33.1 13 34.1 13.7 34.6 14.8 L 47.6 47.2 C 48.3 48.9 47 50.5 45.1 50.5 L 39.2 50.5 C 38.1 50.5 37.1 49.8 36.7 48.7 L 34.2 42.5 L 29.8 42.5 L 27.3 48.7 C 26.9 49.8 25.9 50.5 24.8 50.5 L 18.9 50.5 C 17 50.5 15.7 48.9 16.4 47.2 L 29.4 14.8 C 29.9 13.7 30.9 13 32 13 Z M 32 25 L 28.5 35.5 L 35.5 35.5 Z" fill="url(#primaryGrad)"/>

  <!-- Modern White Diamond Accent Dot inside Apex -->
  <circle cx="32" cy="35.5" r="2.2" fill="#FFFFFF" opacity="0.95"/>
</svg>
